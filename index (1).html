<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TonyLocuras: enlaces y carritos Vitastrong</title>
<meta name="description" content="Exploración de lugares siniestros, rutas a 100 metros bajo tierra y supervivencia real. Cero simulaciones.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<!--
  ESTE ARCHIVO ES EL DISEÑO. No hace falta tocarlo.
  Todo lo que sale en la web (textos, enlaces, packs, precios, promociones) se cambia en datos.js
-->
<style>
:root{
  --bg:#d8d2c4; --card:#e9e5da; --ink:#17140f; --muted:#5b554b; --line:#c4bdac;
  --red:#c2321d; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:32px 16px 48px}
h1,h2,.cond{font-family:"Barlow Condensed",sans-serif;font-weight:700;line-height:1.05}
h1{font-size:clamp(44px,12vw,56px);margin-bottom:8px}
.lead{color:var(--muted);font-size:17px;margin-bottom:24px;white-space:pre-line}
.icon{width:58px;height:58px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon svg{width:28px;height:28px;fill:currentColor}

/* Promociones */
.promo{background:var(--ink);color:var(--white);border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.promo::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:repeating-linear-gradient(-45deg,var(--red) 0 12px,transparent 12px 24px)}
.promo .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 8px;flex-wrap:wrap}
.promo .tag{background:var(--red);font-weight:700;font-size:13px;letter-spacing:.08em;border-radius:6px;padding:3px 9px}
.promo .left{font-size:13px;font-weight:600;color:#f3b4a8}
.promo h2{font-size:clamp(30px,8.5vw,40px);margin-bottom:6px}
.promo p{opacity:.85;margin-bottom:14px}
.promo .go{display:block;background:var(--red);color:var(--white);font-weight:600;text-align:center;border-radius:10px;padding:13px}
.promo + h1{margin-top:12px}

/* YouTube */
.yt{display:block;background:var(--ink);color:var(--white);border-radius:18px;padding:18px;margin-bottom:10px;transition:transform .15s}
.yt:hover,.social:hover{transform:translateY(-2px)}
.yt .row{display:flex;gap:14px;align-items:center}
.yt .icon{background:var(--red)}
.yt h2{font-size:32px}
.yt p{font-size:14px;opacity:.75}
.btn{display:inline-block;background:var(--red);color:var(--white);font-weight:600;font-size:16px;border-radius:999px;padding:12px 18px;border:0;cursor:pointer;font-family:inherit}
.yt .btn{float:right;margin-top:14px}
.yt::after{content:"";display:block;clear:both}

.socials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:26px}
.socials.one{grid-template-columns:1fr}
.social{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;transition:transform .15s}
.social .icon{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--white)}
.social .icon svg{width:18px;height:18px}
.social b{display:block;font-weight:600;font-size:16px;line-height:1.2}
.social small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.social>div:nth-child(2){flex:1;min-width:0}
.follow{display:inline-block;margin-top:8px;background:var(--red);color:var(--white);font-weight:600;font-size:13px;border-radius:999px;padding:5px 10px}
@media (max-width:380px){.socials{grid-template-columns:1fr}}
.inapp{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--white);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:14px}
.inapp p{flex:1}
.inapp a,.inapp button{background:var(--red);color:var(--white);border:0;border-radius:999px;padding:8px 12px;font:600 13px Barlow,sans-serif;white-space:nowrap;cursor:pointer}
.inapp .x{background:transparent;padding:4px 6px;font-size:18px}

/* Miembros */
.member{background:var(--card);border:2px solid var(--red);border-radius:18px;padding:18px;margin-bottom:26px}
.member .head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.member .icon{width:44px;height:44px;border-radius:10px;background:var(--red);color:var(--white)}
.member .icon svg{width:22px;height:22px}
.member h2{font-size:30px}
.member p{color:var(--muted);margin-bottom:14px}
.block{display:block;width:100%;text-align:center;border-radius:10px;padding:14px}

/* Vitastrong */
.vita{background:var(--red);color:var(--white);border-radius:18px;padding:18px;margin-bottom:28px}
.vita h2{font-size:clamp(42px,11vw,52px);margin-bottom:10px}
.vita p{margin-bottom:16px}
.vita .go{display:block;background:var(--white);color:var(--red);font-weight:600;text-align:center;border-radius:10px;padding:13px;margin-bottom:10px}
.code{display:block;width:100%;background:transparent;color:var(--white);border:2px solid rgba(255,255,255,.85);border-radius:10px;padding:10px;cursor:pointer;font-family:inherit;text-align:center}
.code b{display:block;font-size:19px;font-weight:600}
.code small{font-size:13px}
.code.ok{background:rgba(255,255,255,.15)}

/* Carritos */
.carts h2{font-size:34px;margin-bottom:4px}
.carts>p{color:var(--muted);margin-bottom:16px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tab{background:transparent;border:0;border-radius:10px;padding:11px;font:600 16px Barlow,sans-serif;color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--red);color:var(--white)}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.group summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px;cursor:pointer}
.group summary::-webkit-details-marker{display:none}
.group summary h3{font-size:24px}
.group summary .n{color:var(--muted);font-size:14px}
.group summary .pm{margin-left:auto;color:var(--red);font-size:24px;font-weight:600;line-height:1}
.group summary .pm::before{content:"+"}
.group[open] summary .pm::before{content:"−"}
.group[open] summary{border-bottom:1px solid var(--line)}
.pack{display:block;padding:14px 16px;border-bottom:1px solid var(--line);transition:background .15s}
.pack:last-child{border-bottom:0}
.pack:hover{background:#e1dccf}
.pack h4{font-size:17px;font-weight:600}
.pack .inc{color:var(--muted);font-size:14px;margin:2px 0 8px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price s{color:var(--muted);font-size:14px}
.price b{font-size:20px;font-weight:600}
.price small{color:var(--red);font-size:13px}
.extra{display:inline-flex;align-items:baseline;gap:6px;margin-top:6px;background:var(--ink);color:var(--white);border-radius:8px;padding:4px 10px;font-size:13px}
.extra b{font-size:17px}
.note{color:var(--muted);font-size:14px;margin-top:22px}
.err{background:#fff3cd;border:2px solid #c99a00;border-radius:12px;padding:14px;margin-bottom:20px;font-size:15px}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--white);padding:10px 18px;border-radius:999px;font-weight:600;transition:transform .25s,opacity .25s;pointer-events:none;opacity:0;visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div class="toast" id="toast">Código copiado</div>

<script>
function TL_start() {
const app = document.getElementById("app");

if (typeof DATOS === "undefined") {
  app.innerHTML = '<div class="err"><b>La web no carga los datos.</b><br>Seguramente falta o sobra una coma, comilla o corchete en <b>datos.js</b>. Revisa el último cambio que hiciste.</div>';
  return;
}
const D = DATOS;

// ---------- utilidades ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const eur = n => n.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const r2 = n => Math.round(n * 100) / 100;
const visible = x => x && x.activa !== false;
const finDia = f => new Date(f + "T23:59:59");
const hoy = new Date();

const ICON = {
  yt: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8z"/><path fill="#c2321d" d="M10 15V9l5.2 3z"/></svg>',
  ig: '<svg viewBox="0 0 24 24"><path d="M12 7.3A4.7 4.7 0 1 0 12 16.7 4.7 4.7 0 0 0 12 7.3zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM17 5.8a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2zM7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2zm0 1.8a4 4 0 0 0-4 4v8.4a4 4 0 0 0 4 4h8.4a4 4 0 0 0 4-4V7.8a4 4 0 0 0-4-4z"/></svg>',
  tt: '<svg viewBox="0 0 24 24"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-1.8-2.5V9.7a5.7 5.7 0 1 0 4.9 5.7V9.1a7.3 7.3 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.2-1.6z"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>'
};

// ---------- promociones activas y en fecha ----------
const promos = (D.promociones || []).filter(p => visible(p) && (!p.hasta || finDia(p.hasta) >= hoy));
const extraPct = Math.max(0, ...promos.map(p => Number(p.extraEnPacks) || 0));
const extraNombre = (promos.find(p => Number(p.extraEnPacks) === extraPct) || {}).etiqueta || "la promo";

function cuentaAtras(f) {
  if (!f) return "";
  const dias = Math.ceil((finDia(f) - hoy) / 86400000);
  if (dias <= 1) return "Último día";
  return "Quedan " + dias + " días";
}

// ---------- enlaces de redes ----------
const yt = D.youtube || {}, ig = D.instagram || {}, tt = D.tiktok || {}, mb = D.miembros || {}, vs = D.vitastrong || {};
const LINK = {
  yt: "https://www.youtube.com/@" + yt.usuario + "?sub_confirmation=1",
  ytjoin: "https://www.youtube.com/channel/" + yt.idCanal + "/join",
  ig: "https://www.instagram.com/" + ig.usuario + "/",
  tt: "https://www.tiktok.com/@" + tt.usuario
};
const APPS = {
  yt:     { android: "com.google.android.youtube", ios: "youtube://www.youtube.com/@" + yt.usuario + "?sub_confirmation=1" },
  ytjoin: { android: "com.google.android.youtube", ios: "youtube://www.youtube.com/channel/" + yt.idCanal + "/join" },
  ig:     { android: "com.instagram.android",      ios: "instagram://user?username=" + ig.usuario },
  tt:     { android: "com.zhiliaoapp.musically",   ios: null }
};
const ext = 'target="_blank" rel="noopener"';

// ---------- montar la página ----------
let h = '<div class="inapp" id="inapp" hidden></div>';

h += promos.map(p => `
  <section class="promo">
    <div class="top">${p.etiqueta ? `<span class="tag">${esc(p.etiqueta)}</span>` : "<span></span>"}<span class="left">${cuentaAtras(p.hasta)}</span></div>
    ${p.titulo ? `<h2>${esc(p.titulo)}</h2>` : ""}
    ${p.texto ? `<p>${esc(p.texto)}</p>` : ""}
    ${p.boton && p.enlace ? `<a class="go" href="${esc(p.enlace)}" ${ext}>${esc(p.boton)}</a>` : ""}
  </section>`).join("");

h += `<h1>${esc(D.nombre)}</h1><p class="lead">${esc(D.descripcion)}</p>`;

h += `
  <a class="yt" data-app="yt" href="${esc(LINK.yt)}" ${ext}>
    <div class="row"><div class="icon">${ICON.yt}</div><div><h2>YouTube</h2><p>${esc(yt.texto)}</p></div></div>
    <span class="btn">${esc(yt.boton || "Suscribirme")}</span>
  </a>`;

const redes = [];
if (visible(ig)) redes.push(`<a class="social" data-app="ig" href="${esc(LINK.ig)}" ${ext}><div class="icon">${ICON.ig}</div><div><b>Instagram</b><small>${esc(ig.texto)}</small><span class="follow">Seguir</span></div></a>`);
if (visible(tt)) redes.push(`<a class="social" data-app="tt" href="${esc(LINK.tt)}" ${ext}><div class="icon">${ICON.tt}</div><div><b>TikTok</b><small>${esc(tt.texto)}</small><span class="follow">Seguir</span></div></a>`);
if (redes.length) h += `<div class="socials${redes.length === 1 ? " one" : ""}">${redes.join("")}</div>`;

if (visible(mb)) h += `
  <section class="member">
    <div class="head"><div class="icon">${ICON.star}</div><h2>${esc(mb.titulo)}</h2></div>
    <p>${esc(mb.texto)}</p>
    <a class="btn block" data-app="ytjoin" href="${esc(LINK.ytjoin)}" ${ext}>${esc(mb.boton)}</a>
  </section>`;

const pct = Number(vs.descuento) || 0;
h += `
  <section class="vita">
    <h2>${pct} % en Vitastrong</h2>
    <p>${esc(vs.texto).replace("{codigo}", "<b>" + esc(vs.codigo) + "</b>")}</p>
    <a class="go" href="${esc(vs.enlace)}" ${ext}>${esc(vs.boton)}</a>
    <button class="code" id="code" type="button"><b>${esc(vs.codigo)}</b><small>Toca para copiar el código</small></button>
  </section>`;

const tabs = (D.pestanas || []).filter(visible);
const packHTML = p => {
  const conCodigo = typeof p.precioFinal === "number" ? p.precioFinal : r2(p.precio * (1 - pct / 100));
  return `
    <a class="pack" href="${esc(p.enlace)}" ${ext}>
      <h4>${esc(p.nombre)}</h4>
      ${p.incluye ? `<p class="inc">Incluye: ${esc(p.incluye)}</p>` : ""}
      <div class="price"><s>${eur(p.precio)}</s><b>${eur(conCodigo)}</b><small>${pct} % de descuento con mi código</small></div>
      ${extraPct > 0 ? `<span class="extra">Con ${esc(extraNombre)} (−${extraPct} % extra): <b>${eur(r2(conCodigo * (1 - extraPct / 100)))}</b></span>` : ""}
    </a>`;
};
if (tabs.length) {
  h += `<section class="carts"><h2>${esc(D.carritosTitulo)}</h2><p>${esc(D.carritosTexto)}</p>`;
  if (tabs.length > 1) h += `<div class="tabs" role="tablist">${tabs.map((t, i) => `<button class="tab" role="tab" aria-selected="${i === 0}" data-tab="${i}">${esc(t.nombre)}</button>`).join("")}</div>`;
  h += tabs.map((t, i) => `<div class="panel" data-panel="${i}"${i ? " hidden" : ""}>${
    (t.grupos || []).filter(visible).map((g, j) => {
      const packs = (g.packs || []).filter(p => visible(p) && p.nombre && Number(p.precio) > 0 && p.enlace);
      if (!packs.length) return "";
      return `<details class="group"${j === 0 ? " open" : ""}><summary><h3 class="cond">${esc(g.titulo)}</h3><span class="n">${packs.length}</span><span class="pm"></span></summary>${packs.map(packHTML).join("")}</details>`;
    }).join("")}</div>`).join("");
  h += `</section>`;
}

if (D.notaFinal) h += `<p class="note">${esc(D.notaFinal)}</p>`;
app.innerHTML = h;

// ---------- pestañas ----------
app.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  app.querySelectorAll(".tab").forEach(o => o.setAttribute("aria-selected", o === t));
  app.querySelectorAll(".panel").forEach(p => p.hidden = p.dataset.panel !== t.dataset.tab);
}));

// ---------- copiar código ----------
const codeBtn = document.getElementById("code"), toast = document.getElementById("toast");
codeBtn.addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(vs.codigo); }
  catch {
    const ta = document.createElement("textarea"); ta.value = vs.codigo;
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  codeBtn.classList.add("ok"); codeBtn.querySelector("small").textContent = "¡Copiado!";
  toast.classList.add("show");
  setTimeout(() => { toast.classList.remove("show"); codeBtn.classList.remove("ok"); codeBtn.querySelector("small").textContent = "Toca para copiar el código"; }, 1800);
});

// ---------- abrir directamente la app (YouTube, Instagram, TikTok) en el móvil ----------
const UA = navigator.userAgent;
const isAndroid = /Android/i.test(UA);
const isIOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const inApp = /Instagram|FBAN|FBAV|musical_ly|BytedanceWebview|TikTok|Twitter|Snapchat/i.test(UA);
window.TL_go = window.TL_go || (u => { location.href = u; });

app.querySelectorAll("a[data-app]").forEach(a => a.addEventListener("click", e => {
  if (!isAndroid && !isIOS) return;
  const appInfo = APPS[a.dataset.app], web = a.href;
  e.preventDefault();
  if (isAndroid) {
    TL_go("intent://" + web.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=" + appInfo.android +
          ";S.browser_fallback_url=" + encodeURIComponent(web) + ";end");
  } else if (inApp && appInfo.ios) {
    TL_go(appInfo.ios);
    setTimeout(() => { if (!document.hidden) TL_go(web); }, 1500);
  } else {
    TL_go(web);
  }
}));

if (inApp && (isAndroid || isIOS) && location.protocol === "https:") {
  const box = document.getElementById("inapp");
  box.innerHTML = isAndroid
    ? '<p>Ábrelo en Chrome para seguirme con un toque.</p><a href="intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;end">Abrir</a><button class="x" aria-label="Cerrar">×</button>'
    : '<p>Para seguirme con un toque: pulsa <b>···</b> arriba y elige <b>Abrir en el navegador</b>.</p><button class="x" aria-label="Cerrar">×</button>';
  box.hidden = false;
  box.querySelector(".x").onclick = () => box.hidden = true;
}
}

// Carga datos.js siempre fresco (sin versiones viejas guardadas en el móvil)
(function () {
  var s = document.createElement("script");
  s.src = "datos.js?v=" + Date.now();
  s.onload = s.onerror = TL_start;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
